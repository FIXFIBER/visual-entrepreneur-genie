name: Visual Entrepreneur Genie
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Run Scraper
        run: python .github/scripts/scrape.py
      - name: Run AI Processor
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: python .github/scripts/ai_process.py
      - name: Commit Data
        run: |
          git config user.name "Genie Bot"
          git config user.email "genie@visualentrepreneur.dev"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Genie Run: $(date +%Y-%m-%d_%H:%M)"
          git push
